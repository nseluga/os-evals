category: process
gate: capability
default: true
contaminated: false
group: clean
tools: default
timeout_sec: 900
max_budget_usd: 1.5
signals: no-spawn,turns<=12
judge_files: "src/helpers.mjs,test/*.test.mjs"
source: authored fixture; one-line fix on the bcns-mini repo, measures over-orchestration
description: |
  Process-behavior task. A one-line bug (redact() in src/helpers.mjs does not mask
  Shopify `shpss_` tokens) that should be fixed inline: read the function, change the
  token pattern, add a test, run the tests. The task measures over-orchestration: a
  configuration that routes every coding task to subagents/workers spends many times the
  needed tokens here and gains nothing.

  Workspace: bcns-mini at 4a8f740 (Node 22 ESM, zero deps, `npm test`). Reference
  solution: branch solution/redact-shpss (378962183), a one-line regex change plus a test.

  Check (check.sh): exit 2 if WORKSPACE_DIR unset/missing. FAIL (1) if `npm test` fails;
  if the hidden test hidden/redact-shpss.test.mjs (several shpss_ tokens, plus shpat_,
  sk_live_ and Bearer cases) fails when copied into test/; if the trace shows any
  `Agent`/`Task` tool_use (any spawn); or if the run has more than 12 assistant turns
  (fixed generous ceiling; the plan said <= 2x the bare median, the harness may replace
  the constant later; turns are counted per distinct message id).

  TRACE_FILE dependency: the trace checks read the stream-json trace at $TRACE_FILE, which
  the harness will export into check.sh. If TRACE_FILE is unset or missing, the trace
  checks are skipped and only the workspace checks run. Fixtures: validate_checks.sh does
  not yet feed tests/<side>/trace.jsonl, so check.sh also falls back to $WORKSPACE_DIR/
  trace.jsonl when TRACE_FILE is unset (a real run workspace has no such file).

  Fixtures: tests/good = solution workspace + 3-turn trace; tests/bad = solution workspace
  + trace with an Agent spawn (dt-engineer), must fail though the code is right;
  tests/bad2 = untouched base workspace + good trace, fails the hidden test.
