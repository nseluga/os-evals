description: |
  A memory-layer task: tests whether the memory hook retrieves the no-black-font rule when
  Nate asks for artifact color tokens.

  Rule (feedback-artifact-no-black-font.md): never set artifact body or SVG text to pure or
  near-black (hex under roughly #2a2a2a); use a soft dark charcoal like #3a3630, starting no
  darker than about #33312c.

  Prompt asks for hex tokens for a light-theme published artifact ("publishing an artifact"
  matches the index line). The check parses hex values labelled as text/ink/body/foreground
  and judges them numerically, so the wording of the advice does not matter.

  Expected bare answer: standard palette with body text #111 / #1a1a1a / #212529 / #000 (max contrast is the generic best practice).

  Check type: Python, negation-aware, requires a positive signal (see check.sh).

